[project]
name = "ai-roadmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client",
    "google-genai",
    "python-dotenv",
    "mcp[cli]",
    "pandas>=3.0.6",
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=5.7.0",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-google-genai>=0.11.3",
    "pypdf>=6.21.1",
    "nest-asyncio>=1.6.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab-lsp>=5.3.0",
    "nbstripout>=0.9.1",
    "python-lsp-server[all]>=1.15.0",
]
deploy = [
    "fastapi>=0.162.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "uvicorn>=0.54.0",
]

[tool.uv]
default-groups = ["dev", "deploy"]